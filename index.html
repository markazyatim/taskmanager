<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Desktop Task Widget</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
    body {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      color: white;
      padding: 16px;
      height: 100vh;
      overflow: hidden;
      -webkit-app-region: drag; /* Agar widget bisa digeser */
    }
    .header { font-size: 14px; font-weight: 700; color: #38bdf8; margin-bottom: 12px; display: flex; justify-content: space-between; }
    .task-item {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
      -webkit-app-region: no-drag; /* Area tombol bisa diklik */
    }
    .task-item.completed { opacity: 0.5; text-decoration: line-through; }
    .task-title { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    .task-meta { font-size: 11px; color: #94a3b8; display: flex; justify-content: space-between; align-items: center; }
    .btn-done {
      background: #10b981; border: none; color: white; padding: 4px 8px;
      border-radius: 4px; font-size: 11px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header">
    <span>📋 TUGAS HARI INI</span>
    <span id="task-count">0</span>
  </div>
  <div id="task-container">Memuat tugas...</div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script>
    // System Notification Window
    function showWindowsNotification(title, body) {
      if (Notification.permission === "granted") {
        new Notification(title, { body: body });
      } else if (Notification.permission !== "denied") {
        Notification.requestPermission().then(perm => {
          if (perm === "granted") new Notification(title, { body: body });
        });
      }
    }

    // PASTE FIREBASE CONFIG ANDA DI SINI
    const firebaseConfig = {
      apiKey: "PASTE_API_KEY_ANDA",
      authDomain: "PASTE_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://PASTE_PROJECT_ID-default-rtdb.firebaseio.com",
      projectId: "PASTE_PROJECT_ID",
      storageBucket: "PASTE_PROJECT_ID.appspot.com",
      messagingSenderId: "...",
      appId: "..."
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let initialLoad = true;

    // Listen data real-time
    db.ref('tasks').on('value', (snapshot) => {
      const tasks = snapshot.val() || {};
      const container = document.getElementById('task-container');
      container.innerHTML = '';
      let count = 0;

      Object.keys(tasks).forEach(id => {
        const task = tasks[id];
        count++;
        const item = document.createElement('div');
        item.className = `task-item ${task.status === 'done' ? 'completed' : ''}`;
        item.innerHTML = `
          <div class="task-title">${task.text}</div>
          <div class="task-meta">
            <span>Diset ke: ${task.assignee || 'Semua'}</span>
            ${task.status !== 'done' ? `<button class="btn-done" onclick="markDone('${id}')">Selesai</button>` : '<span>✓ Selesai</span>'}
          </div>
        `;
        container.appendChild(item);
      });

      document.getElementById('task-count').innerText = count;

      // Berikan notifikasi jika ada pembaruan setelah load pertama
      if (!initialLoad) {
        showWindowsNotification("Tugas Diperbarui!", "Ada tugas baru atau perubahan pada daftar tugas Anda.");
      }
      initialLoad = false;
    });

    function markDone(id) {
      db.ref('tasks/' + id).update({ status: 'done' });
    }
  </script>
</body>
</html>
